<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Today</h1>
      <p id="summary" class="summary" aria-live="polite">Loading tasks...</p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="120" aria-label="New task" required>
      <button type="submit">Add task</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">To do</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet. Add your first task above.</p>

    <footer>
      <button id="clear-done" class="link-btn">Clear completed</button>
    </footer>

    <section class="cloud-info" aria-label="Deployment details">
      <div id="info">Loading server details...</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
